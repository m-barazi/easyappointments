name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PHP-FPM image
        uses: docker/build-push-action@v6
        with:
          context: docker/php-fpm
          push: true
          tags: |
            ghcr.io/m-barazi/easyappointments-php-fpm:latest
            ghcr.io/m-barazi/easyappointments-php-fpm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: docker/nginx
          push: true
          tags: |
            ghcr.io/m-barazi/easyappointments-nginx:latest
            ghcr.io/m-barazi/easyappointments-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
